<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFit - Mon historique</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>📈 Mon historique</h1>
    <p id="sous-titre">Les séances que tu as enregistrées.</p>
  </header>

  <main>
    <a href="index.html" class="lien-retour">← Retour</a>

    <p id="msg-anonyme" class="msg msg-erreur hidden">
      Tu n'es pas connecté(e) : cet historique n'est disponible que sur cet appareil.
      <a href="login.html">Se connecter</a> pour le retrouver partout.
    </p>

    <div id="liste-seances">
      <p class="chargement">Chargement...</p>
    </div>
  </main>

  <script type="module">
    import { AuthService } from './services/AuthService.js';
    import { HistoriqueSeanceService } from './services/HistoriqueSeanceService.js';

    const listeEl = document.getElementById('liste-seances');
    const msgAnonyme = document.getElementById('msg-anonyme');

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function charger() {
      const seances = await HistoriqueSeanceService.lister();

      if (seances.length === 0) {
        listeEl.innerHTML = '<p class="vide">Aucune séance enregistrée pour le moment.</p>';
        return;
      }

      listeEl.innerHTML = '';
      seances.forEach(seance => {
        const nomsExercices = seance.blocs.map(b => b.exercice.nom).join(', ');
        const div = document.createElement('div');
        div.className = 'carte';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:start; gap:10px">
            <p class="carte-titre">${formatDate(seance.date)}</p>
            <span class="badge badge-vert">~${seance.dureeEstimeeMinutes} min</span>
          </div>
          <p class="carte-desc">${seance.blocs.length} exercice${seance.blocs.length > 1 ? 's' : ''} — ${nomsExercices}</p>
        `;
        listeEl.appendChild(div);
      });
    }

    AuthService.ecouterAuth(user => {
      msgAnonyme.classList.toggle('hidden', !!user);
    });

    charger();
  </script>

</body>
</html>

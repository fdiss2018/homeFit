<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFit - Mon historique</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>📈 Mon historique!</h1>
    <p id="sous-titre">Les séances que tu as enregistrées.</p>
  </header>

  <main>
    <a href="index.html" class="lien-retour">← Retour</a>

    <div class="carte">
      <p class="carte-titre">📤 Sauvegarde</p>
      <p class="carte-desc">Exporte tes séances enregistrées dans un fichier JSON, ou réimporte une sauvegarde.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button id="btn-exporter-historique" class="btn-secondaire" type="button">⬇️ Exporter (JSON)</button>
        <label for="fichier-historique" class="btn-secondaire">📂 Importer (.json)</label>
        <input type="file" id="fichier-historique" accept=".json" class="hidden">
      </div>
      <p id="msg-historique-io" class="msg hidden"></p>
    </div>

    <p id="msg-anonyme" class="msg msg-erreur hidden">
      Tu n'es pas connecté(e) : cet historique n'est disponible que sur cet appareil.
      <a href="login.html">Se connecter</a> pour le retrouver partout.
    </p>

    <div id="liste-seances">
      <p class="chargement">Chargement...</p>
    </div>
  </main>

  <script type="module">
    import { AuthService } from './services/AuthService.js';
    import { HistoriqueSeanceService } from './services/HistoriqueSeanceService.js';
    import { ExerciceService } from './services/ExerciceService.js';
    import { GROUPES_MUSCULAIRES } from './models/Exercice.js';
    import { Seance } from './models/Seance.js';
    import { calculerDureeEstimeeMinutes, SERIES_PAR_EXERCICE, REPOS_ENTRE_SERIES } from './utils/GenerateurSeance.js';
    import { LIBELLES, iconeGroupeHtml } from './utils/constantes.js';
    import { activerClicDetailExercice } from './utils/ModaleExercice.js';

    const listeEl = document.getElementById('liste-seances');
    const msgAnonyme = document.getElementById('msg-anonyme');
    const btnExporterHistorique = document.getElementById('btn-exporter-historique');
    const fichierHistoriqueInput = document.getElementById('fichier-historique');
    const msgHistoriqueIO = document.getElementById('msg-historique-io');

    let seancesChargees = [];
    let tousLesExercices = [];
    let exercicesParId = new Map();
    let idEnEdition = null;
    let seanceEnEdition = null;
    let filtreGroupeEdition = '';

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function afficherMsgHistorique(texte, erreur = false) {
      msgHistoriqueIO.textContent = texte;
      msgHistoriqueIO.className = 'msg ' + (erreur ? 'msg-erreur' : 'msg-ok');
      msgHistoriqueIO.classList.remove('hidden');
      setTimeout(() => msgHistoriqueIO.classList.add('hidden'), 5000);
    }

    btnExporterHistorique.addEventListener('click', () => {
      if (seancesChargees.length === 0) {
        afficherMsgHistorique('Aucune séance à exporter.', true);
        return;
      }
      const donnees = { seances: seancesChargees.map(s => s.toFirestore()) };
      const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const lien = document.createElement('a');
      lien.href = url;
      lien.download = 'historique-export.json';
      lien.click();
      URL.revokeObjectURL(url);
    });

    fichierHistoriqueInput.addEventListener('change', () => {
      const fichier = fichierHistoriqueInput.files[0];
      if (!fichier) return;

      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const data = JSON.parse(e.target.result);
          const items = Array.isArray(data) ? data : (data.seances || []);
          if (items.length === 0) throw new Error('Aucune séance trouvée dans le fichier.');

          let ok = 0, ko = 0;
          for (const item of items) {
            if (!Array.isArray(item.blocs) || item.blocs.length === 0) {
              ko++;
              console.warn('Séance ignorée (aucun bloc valide) :', item);
              continue;
            }
            try {
              const seance = Seance.fromFirestore(null, item);
              seance.dureeEstimeeMinutes = calculerDureeEstimeeMinutes(seance.blocs);
              await HistoriqueSeanceService.ajouter(seance);
              ok++;
            } catch { ko++; }
          }

          afficherMsgHistorique(ko === 0
            ? `✅ ${ok} séance${ok > 1 ? 's' : ''} importée${ok > 1 ? 's' : ''}.`
            : `⚠️ ${ok} importée(s), ${ko} en échec.`, ko > 0);
          await charger();
        } catch (err) {
          afficherMsgHistorique(`❌ ${err.message}`, true);
        }
        fichierHistoriqueInput.value = '';
      };
      reader.readAsText(fichier);
    });

    async function chargerExercices() {
      tousLesExercices = await ExerciceService.listerTous();
      exercicesParId = new Map(tousLesExercices.map(ex => [ex.id, ex]));
    }

    async function charger() {
      seancesChargees = await HistoriqueSeanceService.lister();
      renderListe();
    }

    function renderListe() {
      if (seancesChargees.length === 0) {
        listeEl.innerHTML = '<p class="vide">Aucune séance enregistrée pour le moment.</p>';
        return;
      }

      listeEl.innerHTML = '';
      seancesChargees.forEach(seance => {
        listeEl.appendChild(seance.id === idEnEdition ? construireCarteEdition() : construireCarteAffichage(seance));
      });
    }

    function construireCarteAffichage(seance) {
      const div = document.createElement('div');
      div.className = 'carte';
      div.dataset.id = seance.id;
      const chips = seance.blocs
        .map(b => `<button type="button" class="chip-exercice ouvre-detail-exercice" data-id="${b.exercice.id}">${b.exercice.nom}</button>`)
        .join('');
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:start; gap:10px">
          <p class="carte-titre">${seance.nom || formatDate(seance.date)}</p>
          <span class="badge badge-vert">~${seance.dureeEstimeeMinutes} min</span>
        </div>
        <p class="carte-desc">${seance.nom ? formatDate(seance.date) + ' — ' : ''}${seance.blocs.length} exercice${seance.blocs.length > 1 ? 's' : ''}</p>
        <div style="margin-bottom:10px">${chips}</div>
        <div style="display:flex; gap:8px">
          <button class="btn-primaire btn-lancer" style="flex:1">▶ Lancer</button>
          <button class="btn-secondaire btn-modifier-seance">✏️ Modifier</button>
          <button class="btn-danger btn-suppr-seance">🗑</button>
        </div>
      `;
      return div;
    }

    function construireCarteEdition() {
      const div = document.createElement('div');
      div.className = 'carte';
      div.dataset.id = seanceEnEdition.id;

      const optionsGroupes = '<option value="">Tous les groupes musculaires</option>' +
        GROUPES_MUSCULAIRES.map(g => `<option value="${g}" ${g === filtreGroupeEdition ? 'selected' : ''}>${LIBELLES[g] || g}</option>`).join('');

      const lignesAjout = tousLesExercices
        .filter(ex => !filtreGroupeEdition || ex.groupeMusculaire === filtreGroupeEdition)
        .sort((a, b) => a.nom.localeCompare(b.nom))
        .map(ex => `
          <div class="ligne-ajout-exercice" data-id="${ex.id}">
            ${iconeGroupeHtml(ex.groupeMusculaire, 32)}
            <div class="ligne-ajout-info ouvre-detail-exercice" data-id="${ex.id}">
              <div class="ligne-ajout-nom">${ex.nom}</div>
              ${ex.description ? `<div class="ligne-ajout-desc">${ex.description}</div>` : ''}
            </div>
            <button class="btn-ajout-ligne" type="button" title="Ajouter">➕</button>
          </div>
        `).join('') || '<p class="vide">Aucun exercice pour ce groupe.</p>';

      const blocsHtml = seanceEnEdition.blocs.map((bloc, i) => {
        const unite = bloc.type === 'duree' ? 's' : 'reps';
        return `
          <div class="bloc-exercice">
            <div class="bloc-num">${i + 1}</div>
            <div class="bloc-info">
              <div class="bloc-nom ouvre-detail-exercice" data-id="${bloc.exercice.id}">${bloc.exercice.nom}</div>
              <div class="bloc-detail">
                <input type="number" min="1" class="input input-bloc-edition" data-index="${i}" data-champ="series" value="${bloc.series}"> séries ×
                <input type="number" min="1" class="input input-bloc-edition" data-index="${i}" data-champ="valeur" value="${bloc.valeur}">
                ${unite}
                <br>
                Repos :
                <input type="number" min="0" class="input input-bloc-edition" data-index="${i}" data-champ="reposSecondes" value="${bloc.reposSecondes}">s entre séries ·
                <input type="number" min="0" class="input input-bloc-edition" data-index="${i}" data-champ="reposApresSecondes" value="${bloc.reposApresSecondes}">s entre exercices
              </div>
            </div>
            <div class="bloc-reordonner">
              <button class="btn-reordonner btn-monter-edition" type="button" data-index="${i}" title="Monter" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button class="btn-reordonner btn-descendre-edition" type="button" data-index="${i}" title="Descendre" ${i === seanceEnEdition.blocs.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
            <button class="btn-danger btn-suppr-bloc-edition" type="button" data-index="${i}">🗑</button>
          </div>
        `;
      }).join('');

      div.innerHTML = `
        <div class="champ">
          <label>Nom de la séance</label>
          <input type="text" class="input input-nom-edition" value="${seanceEnEdition.nom || ''}" placeholder="Ex: Séance jambes du lundi">
        </div>
        <p class="carte-desc resume-edition">${seanceEnEdition.blocs.length} exercice${seanceEnEdition.blocs.length > 1 ? 's' : ''} · ~${calculerDureeEstimeeMinutes(seanceEnEdition.blocs)} min</p>
        <div class="liste-blocs-edition">${blocsHtml}</div>
        <div class="champ">
          <label>Ajouter un exercice</label>
          <select class="input select-groupe-edition" style="margin-bottom:8px">${optionsGroupes}</select>
          <div class="liste-ajout">${lignesAjout}</div>
        </div>
        <div style="display:flex; gap:10px; margin-top:12px">
          <button class="btn-primaire btn-enregistrer-edition" style="flex:1">💾 Enregistrer</button>
          <button class="btn-secondaire btn-annuler-edition" style="flex:1">✖ Annuler</button>
        </div>
      `;
      return div;
    }

    function entrerEnEdition(seance) {
      idEnEdition = seance.id;
      filtreGroupeEdition = '';
      seanceEnEdition = new Seance({
        id: seance.id,
        date: seance.date,
        nom: seance.nom,
        criteres: seance.criteres,
        blocs: seance.blocs.map(b => ({ ...b })),
        dureeEstimeeMinutes: seance.dureeEstimeeMinutes
      });
      renderListe();
    }

    const CHAMPS_BLOC_MIN_ZERO = new Set(['reposSecondes', 'reposApresSecondes']);

    listeEl.addEventListener('input', e => {
      const input = e.target;
      if (!input.classList.contains('input-bloc-edition')) return;
      const index = parseInt(input.dataset.index, 10);
      const min = CHAMPS_BLOC_MIN_ZERO.has(input.dataset.champ) ? 0 : 1;
      const valeur = Math.max(min, parseInt(input.value, 10) || min);
      seanceEnEdition.blocs[index][input.dataset.champ] = valeur;
      const resumeEl = input.closest('.carte')?.querySelector('.resume-edition');
      if (resumeEl) {
        const n = seanceEnEdition.blocs.length;
        resumeEl.textContent = `${n} exercice${n > 1 ? 's' : ''} · ~${calculerDureeEstimeeMinutes(seanceEnEdition.blocs)} min`;
      }
    });

    listeEl.addEventListener('change', e => {
      if (e.target.classList.contains('select-groupe-edition')) {
        filtreGroupeEdition = e.target.value;
        renderListe();
      }
    });

    activerClicDetailExercice(listeEl, id => exercicesParId.get(id));

    function echangerBlocsEdition(index, autreIndex) {
      const blocs = seanceEnEdition.blocs;
      if (autreIndex < 0 || autreIndex >= blocs.length) return;
      [blocs[index], blocs[autreIndex]] = [blocs[autreIndex], blocs[index]];
      renderListe();
    }

    listeEl.addEventListener('click', async e => {
      const boutonSupprBloc = e.target.closest('.btn-suppr-bloc-edition');
      if (boutonSupprBloc) {
        seanceEnEdition.blocs.splice(parseInt(boutonSupprBloc.dataset.index, 10), 1);
        renderListe();
        return;
      }

      const boutonMonter = e.target.closest('.btn-monter-edition');
      if (boutonMonter) {
        const index = parseInt(boutonMonter.dataset.index, 10);
        echangerBlocsEdition(index, index - 1);
        return;
      }

      const boutonDescendre = e.target.closest('.btn-descendre-edition');
      if (boutonDescendre) {
        const index = parseInt(boutonDescendre.dataset.index, 10);
        echangerBlocsEdition(index, index + 1);
        return;
      }

      const boutonAjoutLigne = e.target.closest('.btn-ajout-ligne');
      if (boutonAjoutLigne) {
        const idExercice = boutonAjoutLigne.closest('.ligne-ajout-exercice').dataset.id;
        const exercice = exercicesParId.get(idExercice);
        if (exercice && seanceEnEdition) {
          const criteresSeance = seanceEnEdition.criteres || {};
          const type = criteresSeance.enchainementAutomatique ? 'duree' : (criteresSeance.preferenceType || 'repetitions');
          seanceEnEdition.blocs.push({
            exercice,
            series: SERIES_PAR_EXERCICE,
            valeur: type === 'duree' ? exercice.valeurDefautDuree : exercice.valeurDefautRepetitions,
            type,
            reposSecondes: criteresSeance.reposEntreSeriesSecondes ?? REPOS_ENTRE_SERIES,
            reposApresSecondes: criteresSeance.reposEntreExercicesSecondes ?? 60
          });
          renderListe();
        }
        return;
      }

      const boutonEnregistrer = e.target.closest('.btn-enregistrer-edition');
      if (boutonEnregistrer) {
        const carte = boutonEnregistrer.closest('.carte');
        seanceEnEdition.nom = carte.querySelector('.input-nom-edition').value.trim() || null;
        seanceEnEdition.dureeEstimeeMinutes = calculerDureeEstimeeMinutes(seanceEnEdition.blocs);
        await HistoriqueSeanceService.mettreAJour(idEnEdition, seanceEnEdition);
        idEnEdition = null;
        seanceEnEdition = null;
        await charger();
        return;
      }

      const boutonAnnuler = e.target.closest('.btn-annuler-edition');
      if (boutonAnnuler) {
        idEnEdition = null;
        seanceEnEdition = null;
        renderListe();
        return;
      }

      const boutonModifier = e.target.closest('.btn-modifier-seance');
      if (boutonModifier) {
        const id = boutonModifier.closest('.carte').dataset.id;
        const seance = seancesChargees.find(s => s.id === id);
        if (seance) entrerEnEdition(seance);
        return;
      }

      const id = e.target.closest('.carte')?.dataset.id;
      if (!id) return;

      if (e.target.closest('.btn-lancer')) {
        const seance = seancesChargees.find(s => s.id === id);
        if (!seance) return;
        sessionStorage.setItem('hf_execution_seance', JSON.stringify(seance));
        window.location.href = 'execution.html';
        return;
      }

      if (e.target.closest('.btn-suppr-seance')) {
        if (!confirm('Supprimer cette séance de ton historique ?')) return;
        await HistoriqueSeanceService.supprimer(id);
        charger();
      }
    });

    chargerExercices();

    AuthService.ecouterAuth(user => {
      msgAnonyme.classList.toggle('hidden', !!user);
      charger();
    });
  </script>

</body>
</html>

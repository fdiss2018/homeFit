<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFit - Générateur de séance</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>⚡ Générateur de séance</h1>
    <p>Choisis tes critères, on s'occupe du reste.</p>
  </header>

  <main>
    <a href="index.html" class="lien-retour">← Retour</a>

    <div class="carte" id="carte-ia">
      <p class="carte-titre">✨ Décris ta séance</p>
      <p class="carte-desc">Ex. « 20 minutes, jambes et abdos, niveau débutant, pas de matériel »</p>
      <textarea id="description-ia" class="input" rows="3" placeholder="Décris la séance que tu veux..."></textarea>
      <button id="btn-generer-ia" class="btn-secondaire btn-large" type="button" style="margin-top:10px">✨ Générer avec l'IA</button>
      <p id="msg-ia" class="msg hidden"></p>
    </div>

    <div class="carte" id="carte-formulaire">
      <div class="champ">
        <label for="duree">Durée souhaitée</label>
        <select id="duree" class="input">
          <option value="10">10 minutes</option>
          <option value="20" selected>20 minutes</option>
          <option value="30">30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </div>

      <div class="champ">
        <label>Groupes musculaires <span style="text-transform:none">(vide = tous)</span></label>
        <div class="grille-choix" id="choix-groupes"></div>
      </div>

      <div class="champ">
        <label>Matériel disponible <span style="text-transform:none">(vide = poids du corps uniquement)</span></label>
        <div class="grille-choix" id="choix-materiel"></div>
      </div>

      <div class="champ">
        <label style="display:inline-flex; align-items:center; gap:8px; text-transform:none">
          <input type="checkbox" id="avec-illustration">
          Uniquement les exercices avec illustration 🖼️
        </label>
      </div>

      <div class="champ">
        <label for="niveau">Niveau</label>
        <select id="niveau" class="input">
          <option value="debutant">Débutant</option>
          <option value="intermediaire" selected>Intermédiaire</option>
          <option value="avance">Avancé</option>
        </select>
      </div>

      <div class="champ">
        <label for="repos-series">Repos entre séries <span style="text-transform:none">(même exercice)</span></label>
        <select id="repos-series" class="input">
          <option value="0">0 seconde</option>
          <option value="5">5 secondes</option>
          <option value="10">10 secondes</option>
          <option value="15">15 secondes</option>
          <option value="30" selected>30 secondes</option>
          <option value="60">60 secondes</option>
          <option value="90">90 secondes</option>
          <option value="120">120 secondes</option>
        </select>
      </div>

      <div class="champ">
        <label for="repos-exercices">Repos entre exercices <span style="text-transform:none">(en changeant d'exercice)</span></label>
        <select id="repos-exercices" class="input">
          <option value="0">0 seconde</option>
          <option value="5">5 secondes</option>
          <option value="10">10 secondes</option>
          <option value="15">15 secondes</option>
          <option value="30">30 secondes</option>
          <option value="60" selected>60 secondes</option>
          <option value="90">90 secondes</option>
          <option value="120">120 secondes</option>
        </select>
      </div>

      <div class="champ" id="champ-preference-type">
        <label>Préférence répétitions / durée</label>
        <div class="grille-choix" id="choix-preference-type">
          <button type="button" class="choix actif" data-valeur="repetitions">Répétitions</button>
          <button type="button" class="choix" data-valeur="duree">Durée</button>
        </div>
      </div>

      <div class="champ">
        <label style="display:inline-flex; align-items:center; gap:8px; text-transform:none">
          <input type="checkbox" id="enchainement-auto">
          Enchaînement automatique <span style="color:var(--texte-dim)">(tout en durée)</span>
        </label>
      </div>

      <button id="btn-generer" class="btn-primaire btn-large">⚡ Générer ma séance</button>
      <p id="msg-formulaire" class="msg msg-erreur hidden"></p>
    </div>

    <div class="carte hidden" id="carte-resultat">
      <p class="carte-titre">Ta séance</p>
      <p class="carte-desc" id="resume-seance"></p>
      <div id="liste-blocs"></div>
      <div class="champ">
        <label for="filtre-groupe-ajout">Ajouter un exercice</label>
        <select id="filtre-groupe-ajout" class="input" style="margin-bottom:8px">
          <option value="">Tous les groupes musculaires</option>
        </select>
        <div class="grille-choix" id="choix-illustration-ajout" style="margin-bottom:8px"></div>
        <div id="liste-ajout-exercice" class="liste-ajout"></div>
      </div>
      <div class="champ">
        <label for="nom-seance">Nom de la séance (optionnel)</label>
        <input type="text" id="nom-seance" class="input" placeholder="Ex: Séance jambes du lundi">
      </div>
      <div style="display:flex; gap:10px; margin-top:12px">
        <button id="btn-enregistrer" class="btn-primaire" style="flex:1">💾 Enregistrer</button>
        <button id="btn-regenerer" class="btn-secondaire" style="flex:1">🔄 Une autre</button>
      </div>
      <p id="msg-resultat" class="msg hidden"></p>
    </div>
  </main>

  <script type="module">
    import { ExerciceService } from './services/ExerciceService.js';
    import { SeanceService } from './services/SeanceService.js';
    import { GROUPES_MUSCULAIRES } from './models/Exercice.js';
    import { calculerDureeEstimeeMinutes, SERIES_PAR_EXERCICE } from './utils/GenerateurSeance.js';
    import { MesSeancesService } from './services/MesSeancesService.js';
    import { MATERIEL_DISPONIBLE, LIBELLES, iconeGroupeHtml, FILTRE_ILLUSTRATION_OPTIONS, correspondFiltreIllustration } from './utils/constantes.js';
    import { activerClicDetailExercice } from './utils/ModaleExercice.js';

    function creerChoix(conteneur, valeurs, avecIcone = false) {
      valeurs.forEach(valeur => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'choix';
        el.innerHTML = (avecIcone ? iconeGroupeHtml(valeur, 18) : '') + `<span>${LIBELLES[valeur] || valeur}</span>`;
        el.dataset.valeur = valeur;
        el.addEventListener('click', () => el.classList.toggle('actif'));
        conteneur.appendChild(el);
      });
    }

    const choixGroupes  = document.getElementById('choix-groupes');
    const choixMateriel = document.getElementById('choix-materiel');
    creerChoix(choixGroupes, GROUPES_MUSCULAIRES, true);
    creerChoix(choixMateriel, MATERIEL_DISPONIBLE);

    function valeursActives(conteneur) {
      return [...conteneur.querySelectorAll('.choix.actif')].map(el => el.dataset.valeur);
    }

    // Choix exclusif (un seul actif à la fois), contrairement aux groupes/matériel
    // qui sont multi-sélection.
    function creerChoixUnique(conteneur, defaut) {
      conteneur.querySelectorAll('.choix').forEach(el => {
        el.classList.toggle('actif', el.dataset.valeur === defaut);
        el.addEventListener('click', () => {
          conteneur.querySelectorAll('.choix').forEach(b => b.classList.remove('actif'));
          el.classList.add('actif');
        });
      });
    }

    const choixPreferenceType = document.getElementById('choix-preference-type');
    const champPreferenceType = document.getElementById('champ-preference-type');
    const checkboxEnchainement = document.getElementById('enchainement-auto');
    const checkboxAvecIllustration = document.getElementById('avec-illustration');
    creerChoixUnique(choixPreferenceType, 'repetitions');

    checkboxEnchainement.addEventListener('change', () => {
      champPreferenceType.classList.toggle('desactive', checkboxEnchainement.checked);
    });

    const btnGenerer      = document.getElementById('btn-generer');
    const msgFormulaire   = document.getElementById('msg-formulaire');
    const carteResultat   = document.getElementById('carte-resultat');
    const resumeSeance    = document.getElementById('resume-seance');
    const listeBlocs      = document.getElementById('liste-blocs');
    const btnEnregistrer  = document.getElementById('btn-enregistrer');
    const btnRegenerer    = document.getElementById('btn-regenerer');
    const msgResultat     = document.getElementById('msg-resultat');
    const nomSeance       = document.getElementById('nom-seance');
    const filtreGroupeAjout = document.getElementById('filtre-groupe-ajout');
    const choixIllustrationAjout = document.getElementById('choix-illustration-ajout');
    const listeAjoutExercice = document.getElementById('liste-ajout-exercice');

    let exercices = [];
    let seanceCourante = null;

    // À choix unique (pas de toggle indépendant) : cliquer un chip désactive les autres. Distinct
    // de creerChoixUnique ci-dessus, qui câble des boutons déjà présents dans le HTML statique —
    // ici les boutons sont générés depuis FILTRE_ILLUSTRATION_OPTIONS (constantes.js).
    function creerChoixIllustration(conteneur, options, valeurParDefaut) {
      options.forEach(({ valeur, libelle }) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'choix' + (valeur === valeurParDefaut ? ' actif' : '');
        el.textContent = libelle;
        el.dataset.valeur = valeur;
        el.addEventListener('click', () => {
          conteneur.querySelectorAll('.choix').forEach(e => e.classList.toggle('actif', e === el));
          afficherListeAjout();
        });
        conteneur.appendChild(el);
      });
    }
    creerChoixIllustration(choixIllustrationAjout, FILTRE_ILLUSTRATION_OPTIONS, 'tous');

    async function chargerExercices() {
      exercices = await ExerciceService.listerTous();
      filtreGroupeAjout.innerHTML = '<option value="">Tous les groupes musculaires</option>' +
        GROUPES_MUSCULAIRES.map(g => `<option value="${g}">${LIBELLES[g] || g}</option>`).join('');
      afficherListeAjout();
    }

    function afficherListeAjout() {
      const groupe = filtreGroupeAjout.value;
      const filtreIllustration = choixIllustrationAjout.querySelector('.choix.actif')?.dataset.valeur;
      const filtres = exercices
        .filter(ex => !groupe || ex.groupeMusculaire === groupe)
        .filter(ex => correspondFiltreIllustration(ex.image, filtreIllustration))
        .sort((a, b) => a.nom.localeCompare(b.nom));

      if (filtres.length === 0) {
        listeAjoutExercice.innerHTML = '<p class="vide">Aucun exercice pour ces filtres.</p>';
        return;
      }

      listeAjoutExercice.innerHTML = filtres.map(ex => `
        <div class="ligne-ajout-exercice" data-id="${ex.id}">
          ${iconeGroupeHtml(ex.groupeMusculaire, 32)}
          <div class="ligne-ajout-info ouvre-detail-exercice" data-id="${ex.id}">
            <div class="ligne-ajout-nom">${ex.nom}</div>
            ${ex.description ? `<div class="ligne-ajout-desc">${ex.description}</div>` : ''}
          </div>
          <button class="btn-ajout-ligne" type="button" title="Ajouter">➕</button>
        </div>
      `).join('');
    }

    filtreGroupeAjout.addEventListener('change', afficherListeAjout);
    activerClicDetailExercice(listeAjoutExercice, id => exercices.find(ex => ex.id === id));
    activerClicDetailExercice(listeBlocs, id => exercices.find(ex => ex.id === id));

    function rafraichirResume() {
      const n = seanceCourante.blocs.length;
      resumeSeance.textContent = `${n} exercice${n > 1 ? 's' : ''} · ~${seanceCourante.dureeEstimeeMinutes} min`;
    }

    function afficherSeance(seance) {
      seanceCourante = seance;
      nomSeance.value = '';
      rafraichirBlocs();

      carteResultat.classList.remove('hidden');
      msgResultat.classList.add('hidden');
      btnEnregistrer.disabled = false;
      btnEnregistrer.textContent = '💾 Enregistrer';
    }

    function rafraichirBlocs() {
      rafraichirResume();

      listeBlocs.innerHTML = '';
      seanceCourante.blocs.forEach((bloc, i) => {
        const unite = bloc.type === 'duree' ? 's' : 'reps';
        const div = document.createElement('div');
        div.className = 'bloc-exercice';
        div.innerHTML = `
          <div class="bloc-num">${i + 1}</div>
          <div class="bloc-info">
            <div class="bloc-nom ouvre-detail-exercice" data-id="${bloc.exercice.id}">${bloc.exercice.nom}</div>
            <div class="bloc-detail">
              <input type="number" min="1" class="input input-bloc" data-index="${i}" data-champ="series" value="${bloc.series}"> séries ×
              <input type="number" min="1" class="input input-bloc" data-index="${i}" data-champ="valeur" value="${bloc.valeur}">
              ${unite}
              <br>
              Repos :
              <input type="number" min="0" class="input input-bloc" data-index="${i}" data-champ="reposSecondes" value="${bloc.reposSecondes}">s entre séries ·
              <input type="number" min="0" class="input input-bloc" data-index="${i}" data-champ="reposApresSecondes" value="${bloc.reposApresSecondes}">s entre exercices
            </div>
          </div>
          <div class="bloc-reordonner">
            <button class="btn-reordonner btn-monter" type="button" data-index="${i}" title="Monter" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button class="btn-reordonner btn-descendre" type="button" data-index="${i}" title="Descendre" ${i === seanceCourante.blocs.length - 1 ? 'disabled' : ''}>▼</button>
          </div>
          <button class="btn-danger btn-suppr-bloc" type="button" data-index="${i}">🗑</button>
        `;
        listeBlocs.appendChild(div);
      });
    }

    const CHAMPS_BLOC_MIN_ZERO = new Set(['reposSecondes', 'reposApresSecondes']);

    listeBlocs.addEventListener('input', e => {
      const input = e.target;
      if (!input.classList.contains('input-bloc')) return;
      const index = parseInt(input.dataset.index, 10);
      const min = CHAMPS_BLOC_MIN_ZERO.has(input.dataset.champ) ? 0 : 1;
      const valeur = Math.max(min, parseInt(input.value, 10) || min);
      seanceCourante.blocs[index][input.dataset.champ] = valeur;
      seanceCourante.dureeEstimeeMinutes = calculerDureeEstimeeMinutes(seanceCourante.blocs);
      rafraichirResume();
    });

    function echangerBlocs(index, autreIndex) {
      const blocs = seanceCourante.blocs;
      if (autreIndex < 0 || autreIndex >= blocs.length) return;
      [blocs[index], blocs[autreIndex]] = [blocs[autreIndex], blocs[index]];
      seanceCourante.dureeEstimeeMinutes = calculerDureeEstimeeMinutes(blocs);
      rafraichirBlocs();
    }

    listeBlocs.addEventListener('click', e => {
      const boutonSuppr = e.target.closest('.btn-suppr-bloc');
      if (boutonSuppr) {
        const index = parseInt(boutonSuppr.dataset.index, 10);
        seanceCourante.blocs.splice(index, 1);
        seanceCourante.dureeEstimeeMinutes = calculerDureeEstimeeMinutes(seanceCourante.blocs);
        rafraichirBlocs();
        return;
      }

      const boutonMonter = e.target.closest('.btn-monter');
      if (boutonMonter) {
        const index = parseInt(boutonMonter.dataset.index, 10);
        echangerBlocs(index, index - 1);
        return;
      }

      const boutonDescendre = e.target.closest('.btn-descendre');
      if (boutonDescendre) {
        const index = parseInt(boutonDescendre.dataset.index, 10);
        echangerBlocs(index, index + 1);
      }
    });

    listeAjoutExercice.addEventListener('click', e => {
      const bouton = e.target.closest('.btn-ajout-ligne');
      if (!bouton || !seanceCourante) return;
      const id = bouton.closest('.ligne-ajout-exercice').dataset.id;
      const exercice = exercices.find(ex => ex.id === id);
      if (!exercice) return;

      const type = checkboxEnchainement.checked
        ? 'duree'
        : (choixPreferenceType.querySelector('.choix.actif')?.dataset.valeur || 'repetitions');
      const reposSecondes = parseInt(document.getElementById('repos-series').value, 10);
      const reposApresSecondes = parseInt(document.getElementById('repos-exercices').value, 10);

      seanceCourante.blocs.push({
        exercice,
        series: SERIES_PAR_EXERCICE,
        valeur: type === 'duree' ? exercice.valeurDefautDuree : exercice.valeurDefautRepetitions,
        type,
        reposSecondes,
        reposApresSecondes
      });
      seanceCourante.dureeEstimeeMinutes = calculerDureeEstimeeMinutes(seanceCourante.blocs);
      rafraichirBlocs();
    });

    async function genererEtAfficher() {
      msgFormulaire.classList.add('hidden');
      if (exercices.length === 0) {
        msgFormulaire.textContent = "Aucun exercice n'est encore disponible dans la bibliothèque. Importe-en depuis admin.html.";
        msgFormulaire.classList.remove('hidden');
        return;
      }

      const criteres = {
        dureeMinutes: parseInt(document.getElementById('duree').value, 10),
        groupesMusculaires: valeursActives(choixGroupes),
        materielDisponible: valeursActives(choixMateriel),
        avecIllustration: checkboxAvecIllustration.checked,
        niveau: document.getElementById('niveau').value,
        reposEntreSeriesSecondes: parseInt(document.getElementById('repos-series').value, 10),
        reposEntreExercicesSecondes: parseInt(document.getElementById('repos-exercices').value, 10),
        preferenceType: choixPreferenceType.querySelector('.choix.actif')?.dataset.valeur || 'repetitions',
        enchainementAutomatique: checkboxEnchainement.checked
      };

      try {
        const seance = await SeanceService.generer(criteres);
        afficherSeance(seance);
      } catch (err) {
        msgFormulaire.textContent = err.message;
        msgFormulaire.classList.remove('hidden');
      }
    }

    btnGenerer.addEventListener('click', genererEtAfficher);
    btnRegenerer.addEventListener('click', genererEtAfficher);

    btnEnregistrer.addEventListener('click', async () => {
      if (!seanceCourante) return;
      btnEnregistrer.disabled = true;
      try {
        seanceCourante.nom = nomSeance.value.trim() || null;
        await MesSeancesService.ajouter(seanceCourante);
        msgResultat.textContent = '✅ Séance ajoutée à tes séances.';
        msgResultat.className = 'msg msg-ok';
        msgResultat.classList.remove('hidden');
      } catch (err) {
        msgResultat.textContent = `❌ ${err.message}`;
        msgResultat.className = 'msg msg-erreur';
        msgResultat.classList.remove('hidden');
        btnEnregistrer.disabled = false;
      }
    });

    const descriptionIA = document.getElementById('description-ia');
    const btnGenererIA  = document.getElementById('btn-generer-ia');
    const msgIA         = document.getElementById('msg-ia');

    function appliquerCriteresIA(criteres) {
      document.getElementById('duree').value = String(criteres.dureeMinutes);
      document.getElementById('niveau').value = criteres.niveau;
      document.getElementById('repos-series').value = String(criteres.reposEntreSeriesSecondes);
      document.getElementById('repos-exercices').value = String(criteres.reposEntreExercicesSecondes);

      choixGroupes.querySelectorAll('.choix').forEach(el => {
        el.classList.toggle('actif', criteres.groupesMusculaires.includes(el.dataset.valeur));
      });
      choixMateriel.querySelectorAll('.choix').forEach(el => {
        el.classList.toggle('actif', criteres.materielDisponible.includes(el.dataset.valeur));
      });
      checkboxAvecIllustration.checked = criteres.avecIllustration;
      choixPreferenceType.querySelectorAll('.choix').forEach(el => {
        el.classList.toggle('actif', el.dataset.valeur === criteres.preferenceType);
      });
      checkboxEnchainement.checked = criteres.enchainementAutomatique;
      champPreferenceType.classList.toggle('desactive', criteres.enchainementAutomatique);
    }

    btnGenererIA.addEventListener('click', async () => {
      const description = descriptionIA.value.trim();
      msgIA.classList.add('hidden');
      if (!description) {
        msgIA.textContent = "Décris la séance que tu souhaites avant de lancer l'IA.";
        msgIA.className = 'msg msg-erreur';
        msgIA.classList.remove('hidden');
        return;
      }

      btnGenererIA.disabled = true;
      btnGenererIA.textContent = '✨ Analyse en cours...';
      try {
        // L'IA choisit elle-même les exercices adaptés à la description (parmi la
        // bibliothèque), ainsi que la durée et les temps de repos — un seul appel, la
        // séance est prête à être affichée (voir services/SeanceService.js).
        const seance = await SeanceService.genererParIA(description);
        appliquerCriteresIA(seance.criteres);
        afficherSeance(seance);
      } catch (err) {
        msgIA.textContent = `❌ ${err.message}`;
        msgIA.className = 'msg msg-erreur';
        msgIA.classList.remove('hidden');
      } finally {
        btnGenererIA.disabled = false;
        btnGenererIA.textContent = "✨ Générer avec l'IA";
      }
    });

    chargerExercices();
  </script>

</body>
</html>

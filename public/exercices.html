<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFit - Bibliothèque d'exercices</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>📚 Exercices</h1>
    <p>La bibliothèque complète des exercices disponibles.</p>
  </header>

  <main>
    <a href="index.html" class="lien-retour">← Retour</a>

    <div class="carte hidden" id="carte-admin">
      <p class="carte-titre">⚙️ Gestion de la bibliothèque (admin)</p>
      <p class="carte-desc">Importe un fichier JSON (tableau d'exercices ou <code>{ "exercices": [...] }</code>).
        Champs requis : <code>nom</code>, <code>groupeMusculaire</code> (valeur valide).</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <label for="fichier-exercices" class="btn-primaire">📂 Importer (.json)</label>
        <input type="file" id="fichier-exercices" accept=".json" class="hidden">
        <button id="btn-exporter" class="btn-secondaire" type="button">⬇️ Exporter (JSON)</button>
      </div>
      <p id="msg-import" class="msg hidden"></p>
    </div>

    <div class="carte">
      <input type="text" id="recherche" class="input" placeholder="🔍 Rechercher un exercice…" autocomplete="off">
      <div class="champ" style="margin-top:14px; margin-bottom:0">
        <label>Groupes musculaires <span style="text-transform:none">(vide = tous)</span></label>
        <div class="grille-choix" id="choix-groupes"></div>
      </div>
      <div class="champ" style="margin-top:14px; margin-bottom:0">
        <label>Matériel <span style="text-transform:none">(vide = tous)</span></label>
        <div class="grille-choix" id="choix-materiel"></div>
      </div>
    </div>

    <div id="liste-exercices">
      <p class="chargement">Chargement...</p>
    </div>
  </main>

  <script type="module">
    import { AuthService } from './services/AuthService.js';
    import { ADMIN_EMAIL } from './auth-config.js';
    import { ExerciceService } from './services/ExerciceService.js';
    import { Exercice, GROUPES_MUSCULAIRES } from './models/Exercice.js';
    import { MATERIEL_DISPONIBLE } from './utils/constantes.js';

    const NIVEAU_LIBELLE = { debutant: 'Débutant', intermediaire: 'Intermédiaire', avance: 'Avancé' };
    const LIBELLES = {
      jambes: 'Jambes', dos: 'Dos', pectoraux: 'Pectoraux', epaules: 'Épaules',
      bras: 'Bras', abdominaux: 'Abdominaux', cardio: 'Cardio', 'full-body': 'Full-body',
      halteres: 'Haltères', tapis: 'Tapis', banc: 'Banc', elastique: 'Élastique', kettlebell: 'Kettlebell'
    };

    const listeEl = document.getElementById('liste-exercices');
    const rechercheEl = document.getElementById('recherche');
    const choixGroupes = document.getElementById('choix-groupes');
    const choixMateriel = document.getElementById('choix-materiel');
    let tousLesExercices = [];

    function creerChoix(conteneur, valeurs) {
      valeurs.forEach(valeur => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'choix';
        el.textContent = LIBELLES[valeur] || valeur;
        el.dataset.valeur = valeur;
        el.addEventListener('click', () => { el.classList.toggle('actif'); filtrer(); });
        conteneur.appendChild(el);
      });
    }
    creerChoix(choixGroupes, GROUPES_MUSCULAIRES);
    creerChoix(choixMateriel, MATERIEL_DISPONIBLE);

    function valeursActives(conteneur) {
      return [...conteneur.querySelectorAll('.choix.actif')].map(el => el.dataset.valeur);
    }

    function normaliser(texte) {
      return (texte || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    function afficher(exercices) {
      if (exercices.length === 0) {
        listeEl.innerHTML = tousLesExercices.length === 0
          ? '<p class="vide">Aucun exercice dans la bibliothèque pour le moment.</p>'
          : '<p class="vide">Aucun résultat pour ces filtres.</p>';
        return;
      }

      listeEl.innerHTML = '';
      exercices.forEach(ex => {
        const materiel = (ex.materiel || []).length ? ex.materiel.join(', ') : 'Aucun matériel';
        const div = document.createElement('div');
        div.className = 'carte';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:start; gap:10px">
            <p class="carte-titre">${ex.nom}</p>
            <span class="badge">${NIVEAU_LIBELLE[ex.niveau] || ex.niveau}</span>
          </div>
          <p class="carte-desc">${ex.groupeMusculaire} · ${materiel}</p>
          <p class="carte-desc">🔁 ${ex.valeurDefautRepetitions} répétitions · ⏱️ ${ex.valeurDefautDuree}s</p>
          ${ex.description ? `<p class="carte-desc">${ex.description}</p>` : ''}
        `;
        listeEl.appendChild(div);
      });
    }

    function filtrer() {
      const terme = normaliser(rechercheEl.value.trim());
      const groupes = valeursActives(choixGroupes);
      const materiels = valeursActives(choixMateriel);

      const filtres = tousLesExercices.filter(ex => {
        if (terme && !normaliser(ex.nom).includes(terme) && !normaliser(ex.groupeMusculaire).includes(terme)) return false;
        if (groupes.length && !groupes.includes(ex.groupeMusculaire)) return false;
        if (materiels.length && !(ex.materiel || []).some(m => materiels.includes(m))) return false;
        return true;
      });
      afficher(filtres);
    }

    rechercheEl.addEventListener('input', filtrer);

    ExerciceService.ecouterTous(exercices => {
      tousLesExercices = exercices;
      filtrer();
    });

    // ── Panneau admin : import / export JSON (réservé à ADMIN_EMAIL) ──
    const carteAdmin = document.getElementById('carte-admin');
    const fichierInput = document.getElementById('fichier-exercices');
    const msgImport = document.getElementById('msg-import');
    const btnExporter = document.getElementById('btn-exporter');

    AuthService.ecouterAuth(user => {
      carteAdmin.classList.toggle('hidden', user?.email !== ADMIN_EMAIL);
    });

    function afficherMsg(el, texte, erreur = false) {
      el.textContent = texte;
      el.className = 'msg ' + (erreur ? 'msg-erreur' : 'msg-ok');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    fichierInput.addEventListener('change', () => {
      const fichier = fichierInput.files[0];
      if (!fichier) return;

      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const data = JSON.parse(e.target.result);
          const items = Array.isArray(data) ? data : (data.exercices || []);
          if (items.length === 0) throw new Error('Aucun exercice trouvé dans le fichier.');

          let ok = 0, ko = 0;
          for (const item of items) {
            if (!item.nom || !GROUPES_MUSCULAIRES.includes(item.groupeMusculaire)) {
              ko++;
              console.warn('Exercice ignoré (nom ou groupeMusculaire invalide) :', item);
              continue;
            }
            try {
              await ExerciceService.creer(new Exercice(item));
              ok++;
            } catch { ko++; }
          }

          afficherMsg(msgImport, ko === 0
            ? `✅ ${ok} exercice${ok > 1 ? 's' : ''} importé${ok > 1 ? 's' : ''}.`
            : `⚠️ ${ok} importé(s), ${ko} en échec.`, ko > 0);
        } catch (err) {
          afficherMsg(msgImport, `❌ ${err.message}`, true);
        }
        fichierInput.value = '';
      };
      reader.readAsText(fichier);
    });

    btnExporter.addEventListener('click', () => {
      const donnees = { exercices: tousLesExercices.map(ex => ex.toFirestore()) };
      const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const lien = document.createElement('a');
      lien.href = url;
      lien.download = 'exercices-export.json';
      lien.click();
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>

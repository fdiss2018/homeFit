<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFit - Administration</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>⚙️ Administration</h1>
    <p>Gestion de la bibliothèque d'exercices.</p>
    <button id="btn-logout" class="btn-secondaire hidden" style="margin-top:10px">Déconnexion</button>
  </header>

  <main>
    <div class="carte">
      <p class="carte-titre">📚 Bibliothèque d'exercices</p>
      <p class="carte-desc">Importe un fichier JSON (tableau d'exercices ou <code>{ "exercices": [...] }</code>).
        Champs requis : <code>nom</code>, <code>groupeMusculaire</code> (valeur valide).</p>

      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <label for="fichier-exercices" class="btn-primaire">📂 Importer (.json)</label>
        <input type="file" id="fichier-exercices" accept=".json" class="hidden">
        <button id="btn-exporter" class="btn-secondaire" type="button">⬇️ Exporter (JSON)</button>
      </div>
      <p id="msg-import" class="msg hidden"></p>
    </div>

    <div class="carte">
      <p class="carte-titre" id="titre-form-exercice">➕ Ajouter un exercice</p>

      <div class="champ">
        <label for="description-ia-exercice">Décrire l'exercice à l'IA <span style="text-transform:none">(optionnel)</span></label>
        <textarea id="description-ia-exercice" class="input" rows="2" placeholder="Ex : pompes diamant, cible triceps et pectoraux, niveau avancé"></textarea>
        <button id="btn-generer-ia-exercice" class="btn-secondaire" type="button" style="margin-top:8px">✨ Pré-remplir avec l'IA</button>
      </div>
      <hr class="sep">

      <div class="champ">
        <label for="nom-exercice">Nom</label>
        <input type="text" id="nom-exercice" class="input" placeholder="Ex : Pompes diamant">
      </div>
      <div class="champ">
        <label for="groupe-exercice">Groupe musculaire</label>
        <select id="groupe-exercice" class="input"></select>
      </div>
      <div class="champ">
        <label>Matériel <span style="text-transform:none">(vide = poids du corps)</span></label>
        <div class="grille-choix" id="choix-materiel-exercice"></div>
      </div>
      <div class="champ">
        <label for="niveau-exercice">Niveau</label>
        <select id="niveau-exercice" class="input">
          <option value="debutant">Débutant</option>
          <option value="intermediaire">Intermédiaire</option>
          <option value="avance">Avancé</option>
        </select>
      </div>
      <div class="champ" style="display:flex; gap:10px">
        <div style="flex:1">
          <label for="reps-exercice">Répétitions par défaut</label>
          <input type="number" min="1" id="reps-exercice" class="input" value="10">
        </div>
        <div style="flex:1">
          <label for="duree-exercice">Durée par défaut (s)</label>
          <input type="number" min="1" id="duree-exercice" class="input" value="30">
        </div>
      </div>
      <div class="champ">
        <label for="description-exercice">Description</label>
        <textarea id="description-exercice" class="input" rows="2"></textarea>
      </div>
      <div class="champ">
        <label for="instructions-exercice">Instructions</label>
        <textarea id="instructions-exercice" class="input" rows="3"></textarea>
      </div>

      <div style="display:flex; gap:10px">
        <button id="btn-enregistrer-exercice" class="btn-primaire" style="flex:1">💾 Enregistrer</button>
        <button id="btn-annuler-edition-exercice" class="btn-secondaire hidden">✖ Annuler</button>
      </div>
      <p id="msg-form-exercice" class="msg hidden"></p>
    </div>

    <div class="carte">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <p class="carte-titre" style="margin:0">Exercices existants</p>
        <span id="compte-exercices" class="carte-desc" style="margin:0"></span>
      </div>

      <input type="text" id="recherche-admin" class="input" style="margin-top:10px" placeholder="🔍 Rechercher un exercice…" autocomplete="off">
      <div class="champ" style="margin-top:14px; margin-bottom:0">
        <label>Groupes musculaires <span style="text-transform:none">(vide = tous)</span></label>
        <div class="grille-choix" id="choix-groupes-admin"></div>
      </div>
      <div class="champ" style="margin-top:14px">
        <label>Matériel <span style="text-transform:none">(vide = tous)</span></label>
        <div class="grille-choix" id="choix-materiel-admin"></div>
      </div>

      <button id="btn-tout-supprimer" class="btn-danger">🗑️ Tout supprimer</button>
      <p id="msg-suppr-tout" class="msg hidden"></p>
      <hr class="sep">
      <div id="liste-admin">
        <p class="chargement">Chargement...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { ADMIN_EMAIL } from './auth-config.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js';
    import { Exercice, GROUPES_MUSCULAIRES } from './models/Exercice.js';
    import { ExerciceService } from './services/ExerciceService.js';
    import { activerClicDetailExercice } from './utils/ModaleExercice.js';
    import { MATERIEL_DISPONIBLE, LIBELLES, iconeGroupeHtml } from './utils/constantes.js';

    const btnLogout = document.getElementById('btn-logout');

    onAuthStateChanged(auth, user => {
      if (!user) { window.location.href = 'login.html'; return; }
      if (user.email !== ADMIN_EMAIL) {
        signOut(auth).finally(() => { window.location.href = 'login.html'; });
        return;
      }
      btnLogout.classList.remove('hidden');
    });

    btnLogout.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });

    function afficherMsg(el, texte, erreur = false) {
      el.textContent = texte;
      el.className = 'msg ' + (erreur ? 'msg-erreur' : 'msg-ok');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    const fichierInput = document.getElementById('fichier-exercices');
    const msgImport = document.getElementById('msg-import');
    const listeAdmin = document.getElementById('liste-admin');
    const compteExercices = document.getElementById('compte-exercices');
    const btnToutSupprimer = document.getElementById('btn-tout-supprimer');
    const msgSupprTout = document.getElementById('msg-suppr-tout');
    const btnExporter = document.getElementById('btn-exporter');

    let exercicesActuels = [];

    // ── Filtres de la liste (mêmes filtres habituels que exercices.html) ──
    const rechercheAdmin = document.getElementById('recherche-admin');
    const choixGroupesAdmin = document.getElementById('choix-groupes-admin');
    const choixMaterielAdmin = document.getElementById('choix-materiel-admin');

    function creerChoixAdmin(conteneur, valeurs, avecIcone = false) {
      valeurs.forEach(valeur => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'choix';
        el.innerHTML = (avecIcone ? iconeGroupeHtml(valeur, 18) : '') + `<span>${LIBELLES[valeur] || valeur}</span>`;
        el.dataset.valeur = valeur;
        el.addEventListener('click', () => { el.classList.toggle('actif'); filtrerEtAfficherListe(); });
        conteneur.appendChild(el);
      });
    }
    creerChoixAdmin(choixGroupesAdmin, GROUPES_MUSCULAIRES, true);
    creerChoixAdmin(choixMaterielAdmin, MATERIEL_DISPONIBLE);

    function valeursActivesAdmin(conteneur) {
      return [...conteneur.querySelectorAll('.choix.actif')].map(el => el.dataset.valeur);
    }

    function normaliserAdmin(texte) {
      return (texte || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    rechercheAdmin.addEventListener('input', filtrerEtAfficherListe);

    function filtrerEtAfficherListe() {
      const terme = normaliserAdmin(rechercheAdmin.value.trim());
      const groupes = valeursActivesAdmin(choixGroupesAdmin);
      const materiels = valeursActivesAdmin(choixMaterielAdmin);

      const filtres = exercicesActuels.filter(ex => {
        if (terme && !normaliserAdmin(ex.nom).includes(terme) && !normaliserAdmin(ex.groupeMusculaire).includes(terme)) return false;
        if (groupes.length && !groupes.includes(ex.groupeMusculaire)) return false;
        if (materiels.length && !(ex.materiel || []).some(m => materiels.includes(m))) return false;
        return true;
      });

      compteExercices.textContent = filtres.length === exercicesActuels.length
        ? `${exercicesActuels.length} exercice${exercicesActuels.length > 1 ? 's' : ''}`
        : `${filtres.length} / ${exercicesActuels.length} exercice${exercicesActuels.length > 1 ? 's' : ''}`;

      afficherListe(filtres);
    }

    fichierInput.addEventListener('change', () => {
      const fichier = fichierInput.files[0];
      if (!fichier) return;

      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const data = JSON.parse(e.target.result);
          const items = Array.isArray(data) ? data : (data.exercices || []);
          if (items.length === 0) throw new Error('Aucun exercice trouvé dans le fichier.');

          let ok = 0, ko = 0;
          for (const item of items) {
            if (!item.nom || !GROUPES_MUSCULAIRES.includes(item.groupeMusculaire)) {
              ko++;
              console.warn('Exercice ignoré (nom ou groupeMusculaire invalide) :', item);
              continue;
            }
            try {
              await ExerciceService.creer(new Exercice(item));
              ok++;
            } catch { ko++; }
          }

          afficherMsg(msgImport, ko === 0
            ? `✅ ${ok} exercice${ok > 1 ? 's' : ''} importé${ok > 1 ? 's' : ''}.`
            : `⚠️ ${ok} importé(s), ${ko} en échec.`, ko > 0);
        } catch (err) {
          afficherMsg(msgImport, `❌ ${err.message}`, true);
        }
        fichierInput.value = '';
      };
      reader.readAsText(fichier);
    });

    btnToutSupprimer.addEventListener('click', async () => {
      if (exercicesActuels.length === 0) return;
      if (!confirm(`Supprimer définitivement les ${exercicesActuels.length} exercices de la bibliothèque ? Cette action est irréversible.`)) return;
      btnToutSupprimer.disabled = true;

      const resultats = await Promise.allSettled(exercicesActuels.map(ex => ExerciceService.supprimer(ex.id)));
      const ko = resultats.filter(r => r.status === 'rejected').length;
      const ok = resultats.length - ko;

      btnToutSupprimer.disabled = false;
      afficherMsg(msgSupprTout, ko === 0
        ? `✅ ${ok} exercice${ok > 1 ? 's' : ''} supprimé${ok > 1 ? 's' : ''}.`
        : `⚠️ ${ok} supprimé(s), ${ko} en échec.`, ko > 0);
    });

    btnExporter.addEventListener('click', () => {
      const donnees = { exercices: exercicesActuels.map(ex => ex.toFirestore()) };
      const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const lien = document.createElement('a');
      lien.href = url;
      lien.download = 'exercices-export.json';
      lien.click();
      URL.revokeObjectURL(url);
    });

    // ── Formulaire d'ajout / modification manuelle d'un exercice ──
    const titreFormExercice   = document.getElementById('titre-form-exercice');
    const nomExerciceEl       = document.getElementById('nom-exercice');
    const groupeExerciceEl    = document.getElementById('groupe-exercice');
    const choixMaterielExercice = document.getElementById('choix-materiel-exercice');
    const niveauExerciceEl    = document.getElementById('niveau-exercice');
    const repsExerciceEl      = document.getElementById('reps-exercice');
    const dureeExerciceEl     = document.getElementById('duree-exercice');
    const descriptionExerciceEl = document.getElementById('description-exercice');
    const instructionsExerciceEl = document.getElementById('instructions-exercice');
    const btnEnregistrerExercice = document.getElementById('btn-enregistrer-exercice');
    const btnAnnulerEditionExercice = document.getElementById('btn-annuler-edition-exercice');
    const msgFormExercice = document.getElementById('msg-form-exercice');
    const descriptionIAExercice = document.getElementById('description-ia-exercice');
    const btnGenererIAExercice = document.getElementById('btn-generer-ia-exercice');

    groupeExerciceEl.innerHTML = GROUPES_MUSCULAIRES.map(g => `<option value="${g}">${LIBELLES[g] || g}</option>`).join('');

    MATERIEL_DISPONIBLE.forEach(valeur => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'choix';
      el.textContent = LIBELLES[valeur] || valeur;
      el.dataset.valeur = valeur;
      el.addEventListener('click', () => el.classList.toggle('actif'));
      choixMaterielExercice.appendChild(el);
    });

    let idExerciceEnEdition = null;

    function reinitialiserFormulaireExercice() {
      idExerciceEnEdition = null;
      titreFormExercice.textContent = '➕ Ajouter un exercice';
      btnEnregistrerExercice.textContent = '💾 Enregistrer';
      btnAnnulerEditionExercice.classList.add('hidden');
      nomExerciceEl.value = '';
      groupeExerciceEl.selectedIndex = 0;
      choixMaterielExercice.querySelectorAll('.choix').forEach(el => el.classList.remove('actif'));
      niveauExerciceEl.value = 'debutant';
      repsExerciceEl.value = 10;
      dureeExerciceEl.value = 30;
      descriptionExerciceEl.value = '';
      instructionsExerciceEl.value = '';
      descriptionIAExercice.value = '';
    }

    function remplirFormulaireExercice(ex) {
      nomExerciceEl.value = ex.nom || '';
      groupeExerciceEl.value = ex.groupeMusculaire || '';
      choixMaterielExercice.querySelectorAll('.choix').forEach(el => {
        el.classList.toggle('actif', (ex.materiel || []).includes(el.dataset.valeur));
      });
      niveauExerciceEl.value = ex.niveau || 'debutant';
      repsExerciceEl.value = ex.valeurDefautRepetitions ?? 10;
      dureeExerciceEl.value = ex.valeurDefautDuree ?? 30;
      descriptionExerciceEl.value = ex.description || '';
      instructionsExerciceEl.value = ex.instructions || '';
    }

    function entrerEnEditionExercice(ex) {
      idExerciceEnEdition = ex.id;
      titreFormExercice.textContent = `✏️ Modifier « ${ex.nom} »`;
      btnEnregistrerExercice.textContent = '💾 Mettre à jour';
      btnAnnulerEditionExercice.classList.remove('hidden');
      remplirFormulaireExercice(ex);
      titreFormExercice.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    btnAnnulerEditionExercice.addEventListener('click', reinitialiserFormulaireExercice);

    btnEnregistrerExercice.addEventListener('click', async () => {
      const nom = nomExerciceEl.value.trim();
      if (!nom) {
        afficherMsg(msgFormExercice, '❌ Le nom est requis.', true);
        return;
      }

      const exercice = new Exercice({
        nom,
        groupeMusculaire: groupeExerciceEl.value,
        materiel: [...choixMaterielExercice.querySelectorAll('.choix.actif')].map(el => el.dataset.valeur),
        niveau: niveauExerciceEl.value,
        valeurDefautRepetitions: Math.max(1, parseInt(repsExerciceEl.value, 10) || 10),
        valeurDefautDuree: Math.max(1, parseInt(dureeExerciceEl.value, 10) || 30),
        description: descriptionExerciceEl.value.trim(),
        instructions: instructionsExerciceEl.value.trim()
      });

      btnEnregistrerExercice.disabled = true;
      try {
        if (idExerciceEnEdition) {
          await ExerciceService.mettreAJour(idExerciceEnEdition, exercice);
          afficherMsg(msgFormExercice, `✅ « ${nom} » mis à jour.`);
        } else {
          await ExerciceService.creer(exercice);
          afficherMsg(msgFormExercice, `✅ « ${nom} » ajouté à la bibliothèque.`);
        }
        reinitialiserFormulaireExercice();
      } catch (err) {
        afficherMsg(msgFormExercice, `❌ ${err.message}`, true);
      } finally {
        btnEnregistrerExercice.disabled = false;
      }
    });

    btnGenererIAExercice.addEventListener('click', async () => {
      const description = descriptionIAExercice.value.trim();
      if (!description) {
        afficherMsg(msgFormExercice, "❌ Décris l'exercice avant de lancer l'IA.", true);
        return;
      }

      btnGenererIAExercice.disabled = true;
      btnGenererIAExercice.textContent = '✨ Analyse en cours...';
      try {
        // Import dynamique : un gemini-config.js absent (pas encore configuré,
        // voir gemini-config.example.js) ne doit pas casser le reste du formulaire.
        let GeminiService;
        try {
          ({ GeminiService } = await import('./services/GeminiService.js'));
        } catch {
          throw new Error("IA non configurée : crée public/gemini-config.js (voir gemini-config.example.js).");
        }

        const exercice = await GeminiService.interpreterExercice(description);
        remplirFormulaireExercice(exercice);
        afficherMsg(msgFormExercice, '✅ Fiche pré-remplie, relis-la avant d\'enregistrer.');
      } catch (err) {
        afficherMsg(msgFormExercice, `❌ ${err.message}`, true);
      } finally {
        btnGenererIAExercice.disabled = false;
        btnGenererIAExercice.textContent = "✨ Pré-remplir avec l'IA";
      }
    });

    function afficherListe(exercices) {
      if (exercices.length === 0) {
        listeAdmin.innerHTML = exercicesActuels.length === 0
          ? '<p class="vide">Aucun exercice importé.</p>'
          : '<p class="vide">Aucun résultat pour ces filtres.</p>';
        return;
      }

      listeAdmin.innerHTML = '';
      exercices.forEach(ex => {
        const row = document.createElement('div');
        row.className = 'bloc-exercice';
        row.innerHTML = `
          <div class="bloc-info ouvre-detail-exercice" data-id="${ex.id}">
            <div class="bloc-nom">${ex.nom}</div>
            <div class="bloc-detail">${ex.groupeMusculaire} · ${ex.niveau}</div>
          </div>
          <button class="btn-secondaire btn-modifier-exercice" title="Modifier">✏️</button>
          <button class="btn-danger btn-supprimer-exercice" title="Supprimer">🗑️</button>
        `;
        row.querySelector('.btn-modifier-exercice').addEventListener('click', () => entrerEnEditionExercice(ex));
        row.querySelector('.btn-supprimer-exercice').addEventListener('click', async () => {
          if (!confirm(`Supprimer « ${ex.nom} » ?`)) return;
          await ExerciceService.supprimer(ex.id);
        });
        listeAdmin.appendChild(row);
      });
    }

    activerClicDetailExercice(listeAdmin, id => exercicesActuels.find(ex => ex.id === id));

    ExerciceService.ecouterTous(exercices => {
      exercicesActuels = exercices;
      filtrerEtAfficherListe();
    });
  </script>

</body>
</html>
